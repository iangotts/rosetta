/fonts.gstatic.com/s/sora/v17/xMQ9uFFYT72X5wkB_18qmnndmSdSnh2BAfO5mnuyOo1lfiQwWa-xo6eeI7fM.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9f9b44fe-9fa6-46b0-add1-04865a455259\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml{scroll-behavior:smooth}\nbody{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:#0B2540;background:#ffffff}\na{color:#106EBE}\na:focus-visible,button:focus-visible{outline:3px solid #ffffff;outline-offset:2px;box-shadow:0 0 0 6px #062A4D}\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100%;background:#ffffff;font-family:'DM Sans',system-ui,sans-serif\" data-canvas-width=\"1440\" data-canvas-height=\"5000\" data-document-role=\"page\" data-label=\"CalTesting home page\">\n\n<!-- NAV -->\n<div style=\"background:#106EBE;padding:0 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px 0\">\n    <a href=\"#top\" style=\"display:flex;align-items:center;gap:12px;text-decoration:none;color:#ffffff;min-height:44px\">\n      <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 40 40\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"15\" fill=\"none\" stroke=\"#0FFCBE\" stroke-width=\"6\" stroke-dasharray=\"70 30\" transform=\"rotate(40 20 20)\"><\u002Fcircle><rect x=\"18\" y=\"13\" width=\"4\" height=\"14\" rx=\"2\" fill=\"#ffffff\"><\u002Frect><rect x=\"13\" y=\"18\" width=\"14\" height=\"4\" rx=\"2\" fill=\"#ffffff\"><\u002Frect><\u002Fsvg>\n      <span style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.01em\">CalTesting<\u002Fspan>\n    <\u002Fa>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px\">\n      <a href=\"#phases\" style=\"color:#ffffff;text-decoration:none;font-weight:500;font-size:16px;min-height:44px;display:flex;align-items:center\">Trial phases<\u002Fa>\n      <a href=\"#how\" style=\"color:#ffffff;text-decoration:none;font-weight:500;font-size:16px;min-height:44px;display:flex;align-items:center\">How we run trials<\u002Fa>\n      <a href=\"#participants\" style=\"color:#ffffff;text-decoration:none;font-weight:500;font-size:16px;min-height:44px;display:flex;align-items:center\">Participants<\u002Fa>\n      <a href=\"#compliance\" style=\"color:#ffffff;text-decoration:none;font-weight:500;font-size:16px;min-height:44px;display:flex;align-items:center\">Privacy and compliance<\u002Fa>\n      <a href=\"#contact\" style=\"background:#0FFCBE;color:#062A4D;text-decoration:none;font-weight:700;font-size:16px;min-height:44px;padding:0 24px;border-radius:999px;display:flex;align-items:center\">Partner with us<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- HERO -->\n<div id=\"top\" style=\"background:#106EBE;padding:48px 24px 96px;position:relative;overflow:hidden\">\n  <div aria-hidden=\"true\" style=\"position:absolute;right:-140px;top:40px;width:560px;height:560px;border-radius:50%;border:72px solid #0FFCBE;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(20deg)\"><\u002Fdiv>\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:48px;align-items:center;position:relative\">\n    <div style=\"flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"color:#0FFCBE;font-weight:700;font-size:15px;letter-spacing:0.08em;text-transform:uppercase\">Clinical trial operations · San Francisco, California<\u002Fdiv>\n      <h1 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(38px,5.2vw,68px);line-height:1.05;letter-spacing:-0.02em;color:#ffffff;text-wrap:balance\">Faster trials.<br><span style=\"color:#0FFCBE\">Better-matched patients.<\u002Fspan><br>Cleaner results.<\u002Fh1>\n      <p style=\"margin:0;font-size:20px;line-height:1.55;color:#F2F8FD;max-width:560px\">CalTesting runs Phase 1 through Phase 4 clinical trials across the United States for the pharmaceutical companies bringing new treatments to market.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n        <a href=\"#how\" style=\"background:#0FFCBE;color:#062A4D;text-decoration:none;font-weight:700;font-size:17px;min-height:52px;padding:0 32px;border-radius:999px;display:flex;align-items:center\">See how we run a trial<\u002Fa>\n        <a href=\"#participants\" style=\"border:2px solid #ffffff;color:#ffffff;text-decoration:none;font-weight:700;font-size:17px;min-height:52px;box-sizing:border-box;padding:0 32px;border-radius:999px;display:flex;align-items:center\">Join a trial<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 400px;min-width:0;background:#ffffff;border-radius:24px;padding:32px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;box-shadow:0 24px 60px rgba(6,42,77,0.35);position:relative\">\n      <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:20px;color:#062A4D\">One trial, from signed study to next phase<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:32px;height:32px;border-radius:50%;background:#106EBE;color:#ffffff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none\">1<\u002Fdiv><div style=\"font-size:17px;color:#0B2540\">Win the study with the sponsor<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:32px;height:32px;border-radius:50%;background:#106EBE;color:#ffffff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none\">2<\u002Fdiv><div style=\"font-size:17px;color:#0B2540\">Find and reach matching participants<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:32px;height:32px;border-radius:50%;background:#106EBE;color:#ffffff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none\">3<\u002Fdiv><div style=\"font-size:17px;color:#0B2540\">Verify, consent and enroll<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:32px;height:32px;border-radius:50%;background:#106EBE;color:#ffffff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none\">4<\u002Fdiv><div style=\"font-size:17px;color:#0B2540\">Run visits and collect results<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:32px;height:32px;border-radius:50%;background:#106EBE;color:#ffffff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none\">5<\u002Fdiv><div style=\"font-size:17px;color:#0B2540\">Return results to the sponsor<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:32px;height:32px;border-radius:50%;background:#0FFCBE;color:#062A4D;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none\">6<\u002Fdiv><div style=\"font-size:17px;color:#0B2540;font-weight:700\">Move from Phase 1 to Phase 2 and beyond<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#EAF4FD;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.5;color:#3F5A75\">AI agents handle the routine work. Clinicians and investigators make every medical decision.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- AUDIENCE STRIP -->\n<div style=\"background:#062A4D;padding:28px 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center;justify-content:space-between\">\n    <div style=\"color:#ffffff;font-size:18px;font-weight:500\">Built for Tier 1 pharmaceutical sponsors running studies anywhere in the United States.<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n      <span style=\"border:1px solid #0FFCBE;color:#0FFCBE;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700\">Phases 1 to 4<\u002Fspan>\n      <span style=\"border:1px solid #0FFCBE;color:#0FFCBE;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700\">Nationwide sites<\u002Fspan>\n      <span style=\"border:1px solid #0FFCBE;color:#0FFCBE;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700\">HIPAA and CCPA<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PHASES (interactive) -->\n<div id=\"phases\" style=\"background:#EAF4FD;padding:96px 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:40px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:760px\">\n      <div style=\"color:#106EBE;font-weight:700;font-size:15px;letter-spacing:0.08em;text-transform:uppercase\">Trial phases<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.12;letter-spacing:-0.015em;color:#062A4D;text-wrap:balance\">We run every phase, so sponsors never have to hand a study off.<\u002Fh2>\n      <p style=\"margin:0;font-size:19px;line-height:1.55;color:#3F5A75\">Pick a phase to see what it tests and what CalTesting does during it.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background:#ffffff;border-radius:24px;padding:40px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:40px;box-shadow:0 12px 40px rgba(16,110,190,0.14)\">\n      <div style=\"flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:30px;line-height:1.15;color:#062A4D\">{{ cur.title }}<\u002Fdiv>\n        <p style=\"margin:0;font-size:18px;line-height:1.6;color:#3F5A75\">{{ cur.tests }}<\u002Fp>\n        <div style=\"background:#EAF4FD;border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.5;color:#0B2540\"><strong>Typical group size:<\u002Fstrong> {{ cur.size }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font-weight:700;font-size:15px;letter-spacing:0.08em;text-transform:uppercase;color:#106EBE\">What CalTesting does<\u002Fdiv>\n        <sc-for list=\"{{ cur.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:14px;align-items:flex-start\">\n            <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 28 28\" aria-hidden=\"true\" style=\"flex:none\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#0FFCBE\"><\u002Fcircle><path d=\"M8 14.5l4 4 8-9\" fill=\"none\" stroke=\"#062A4D\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:17px;line-height:1.5;color:#0B2540\">{{ it.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"margin-top:8px;border-top:1px solid #C9DFF3;padding-top:16px;font-size:16px;line-height:1.5;color:#3F5A75\"><strong style=\"color:#062A4D\">What comes next:<\u002Fstrong> {{ cur.next }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- HOW WE RUN A TRIAL -->\n<div id=\"how\" style=\"background:#ffffff;padding:96px 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:48px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:820px\">\n      <div style=\"color:#106EBE;font-weight:700;font-size:15px;letter-spacing:0.08em;text-transform:uppercase\">How we run a trial<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.12;letter-spacing:-0.015em;color:#062A4D;text-wrap:balance\">Seven steps. Agents take the busywork, people make the calls.<\u002Fh2>\n      <p style=\"margin:0;font-size:19px;line-height:1.55;color:#3F5A75\">Each step shows what our AI agents do and what our people do. No agent decides who is eligible for a study, and no agent gives medical advice.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n      <div style=\"flex:1 1 320px;min-width:0;border:2px solid #D5E7F7;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:#106EBE\">STEP 1<\u002Fdiv>\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:23px;color:#062A4D\">Win the study<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#106EBE\">Agents<\u002Fstrong> draft feasibility briefs and point to similar past studies.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#062A4D\">People<\u002Fstrong> lead the sponsor relationship, set scope and agree timelines.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0;border:2px solid #D5E7F7;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:#106EBE\">STEP 2<\u002Fdiv>\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:23px;color:#062A4D\">Find potential participants<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#106EBE\">Agents<\u002Fstrong> search consented records and referral partners for people who may fit the protocol.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#062A4D\">People<\u002Fstrong> review every shortlist before anyone is contacted.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0;border:2px solid #D5E7F7;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:#106EBE\">STEP 3<\u002Fdiv>\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:23px;color:#062A4D\">Reach out and verify<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#106EBE\">Agents<\u002Fstrong> send plain-language outreach, answer routine questions and gather screening answers.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#062A4D\">Clinicians<\u002Fstrong> confirm eligibility and medical history.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0;border:2px solid #D5E7F7;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:#106EBE\">STEP 4<\u002Fdiv>\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:23px;color:#062A4D\">Consent and enroll<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#106EBE\">Agents<\u002Fstrong> book visits and send reminders.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#062A4D\">Investigators<\u002Fstrong> explain risks and benefits and collect informed consent.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0;border:2px solid #D5E7F7;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:#106EBE\">STEP 5<\u002Fdiv>\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:23px;color:#062A4D\">Treat, monitor and collect results<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#106EBE\">Agents<\u002Fstrong> prompt check-ins and flag missed or out-of-range entries.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#062A4D\">Clinical staff<\u002Fstrong> run exams and respond to every safety event.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0;border:2px solid #D5E7F7;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:#106EBE\">STEP 6<\u002Fdiv>\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:23px;color:#062A4D\">Return results to the sponsor<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#106EBE\">Agents<\u002Fstrong> compile visit data into sponsor-ready reports and status updates.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\"><strong style=\"color:#062A4D\">Data managers<\u002Fstrong> review everything before it leaves CalTesting.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0;background:#062A4D;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:#0FFCBE\">STEP 7<\u002Fdiv>\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:23px;color:#ffffff\">Earn the next phase<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#ffffff\"><strong style=\"color:#0FFCBE\">Agents<\u002Fstrong> flag studies that are ready for the next phase and draft the proposal.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#ffffff\"><strong style=\"color:#0FFCBE\">Account teams<\u002Fstrong> sit down with the sponsor to plan Phase 2, 3 or 4.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- SPONSORS AND PARTICIPANTS -->\n<div id=\"participants\" style=\"background:#106EBE;padding:96px 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:32px\">\n    <div style=\"flex:1 1 440px;min-width:0;background:#ffffff;border-radius:24px;padding:40px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"color:#106EBE;font-weight:700;font-size:15px;letter-spacing:0.08em;text-transform:uppercase\">For sponsors<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(26px,3vw,34px);line-height:1.15;color:#062A4D\">One team from first dose to final report.<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-size:17px;line-height:1.55;color:#0B2540\"><strong>See progress between milestones.<\u002Fstrong> Enrollment, visit completion and open issues stay visible while the study runs.<\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.55;color:#0B2540\"><strong>Get results you can use.<\u002Fstrong> Reviewed data goes to your team on the schedule in the protocol.<\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.55;color:#0B2540\"><strong>Stay with one partner.<\u002Fstrong> The team that ran Phase 1 already knows the study when Phase 2 begins.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 440px;min-width:0;background:#0FFCBE;border-radius:24px;padding:40px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"color:#062A4D;font-weight:700;font-size:15px;letter-spacing:0.08em;text-transform:uppercase\">For participants<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(26px,3vw,34px);line-height:1.15;color:#062A4D\">Taking part is your choice, and you stay in control.<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-size:17px;line-height:1.55;color:#062A4D\"><strong>You decide with full information.<\u002Fstrong> We explain the risks, benefits and every procedure before you agree to anything.<\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.55;color:#062A4D\"><strong>You can leave at any time.<\u002Fstrong> Stopping never affects your regular medical care.<\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.55;color:#062A4D\"><strong>Your information stays private.<\u002Fstrong> We only contact you through channels you have agreed to.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:16px;line-height:1.5;color:#062A4D;border-top:2px solid #062A4D;padding-top:16px\">To ask about open studies, contact our participant team: [YOUR PARTICIPANT PHONE NUMBER] or [YOUR PARTICIPANT EMAIL].<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- COMPLIANCE -->\n<div id=\"compliance\" style=\"background:#ffffff;padding:96px 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:48px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:820px\">\n      <div style=\"color:#106EBE;font-weight:700;font-size:15px;letter-spacing:0.08em;text-transform:uppercase\">Privacy and compliance<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.12;letter-spacing:-0.015em;color:#062A4D;text-wrap:balance\">Health information needs more care than most data.<\u002Fh2>\n      <p style=\"margin:0;font-size:19px;line-height:1.55;color:#3F5A75\">We operate only in the United States, with trial sites in many states. Our practices follow the rules that apply here.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n      <div style=\"flex:1 1 260px;min-width:0;background:#EAF4FD;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:22px;color:#062A4D\">HIPAA<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\">Protected health information is limited to the staff who need it, kept behind access controls, and logged so we can see who opened a record.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 260px;min-width:0;background:#EAF4FD;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:22px;color:#062A4D\">California privacy law (CCPA)<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\">California residents can ask what we hold about them and request deletion where the law allows. We do not sell participant information.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 260px;min-width:0;background:#EAF4FD;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:22px;color:#062A4D\">FDA and IRB oversight<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\">Every study follows a written protocol reviewed by an Institutional Review Board and runs under FDA requirements.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 260px;min-width:0;background:#EAF4FD;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:22px;color:#062A4D\">Human review of AI<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#0B2540\">Agents prepare and route work. Qualified staff approve eligibility, safety decisions and anything sent to a sponsor.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- CONTACT -->\n<div id=\"contact\" style=\"background:#062A4D;padding:96px 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:40px;align-items:center;justify-content:space-between\">\n    <div style=\"flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n      <h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(30px,3.8vw,48px);line-height:1.1;letter-spacing:-0.015em;color:#ffffff;text-wrap:balance\">Planning a study? <span style=\"color:#0FFCBE\">Tell us the protocol.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:0;font-size:19px;line-height:1.55;color:#E6F1FB;max-width:560px\">Our sponsor team will respond with a feasibility view, a site plan and a timeline.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 360px;min-width:0;background:#106EBE;border-radius:24px;padding:32px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:20px;color:#ffffff\">Sponsor team<\u002Fdiv>\n      <div style=\"font-size:18px;color:#ffffff\">[YOUR SPONSOR EMAIL]<\u002Fdiv>\n      <div style=\"font-size:18px;color:#ffffff\">[YOUR PHONE NUMBER]<\u002Fdiv>\n      <div style=\"font-size:16px;line-height:1.5;color:#F2F8FD\">CalTesting<br>[YOUR STREET ADDRESS]<br>San Francisco, California<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- FOOTER -->\n<div style=\"background:#041E38;padding:32px 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center;justify-content:space-between\">\n    <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:#ffffff\">CalTesting<\u002Fdiv>\n    <div style=\"font-size:14px;line-height:1.5;color:#E6F1FB;max-width:640px\">CalTesting is a fictional company created for demonstration. Nothing on this page describes a real service, and no real sponsor is named or implied.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5000}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const phases = [\n      { id: 'p1', label: 'Phase 1', title: 'Phase 1: Is it safe, and at what dose?', tests: 'Phase 1 tests safety, side effects and dosage in a small group of people.', size: 'Often around 15 to 50 people.', items: [{ text: 'Recruit and verify a small, tightly screened group.' }, { text: 'Run dosing visits and safety monitoring exactly to protocol.' }, { text: 'Return safety data to the sponsor on a set schedule.' }], next: 'Clean Phase 1 data is how we earn the Phase 2 conversation.' },\n      { id: 'p2', label: 'Phase 2', title: 'Phase 2: Does it work?', tests: 'Phase 2 looks at effectiveness and keeps watching side effects in a larger group who have the target condition.', size: 'Often dozens to 100 or more people.', items: [{ text: 'Find participants who have the condition under study.' }, { text: 'Track response and side effects across every visit.' }, { text: 'Flag early which cohorts support Phase 3 planning.' }], next: 'Results from Phase 2 shape the design of the Phase 3 study.' },\n      { id: 'p3', label: 'Phase 3', title: 'Phase 3: Does it hold up at scale?', tests: 'Phase 3 confirms effectiveness and tracks side effects in hundreds or thousands of people, often against a standard therapy or placebo using randomization and blinding.', size: 'Often hundreds to thousands of people.', items: [{ text: 'Coordinate enrollment across sites in many states.' }, { text: 'Support randomization and blinding procedures.' }, { text: 'Keep sponsors informed at every milestone.' }], next: 'If Phase 3 succeeds, regulators review the full data to decide on approval.' },\n      { id: 'p4', label: 'Phase 4', title: 'Phase 4: What happens in the real world?', tests: 'Phase 4 monitors long-term safety, rare side effects and real-world performance after approval.', size: 'The broader population using the approved treatment.', items: [{ text: 'Follow participants over the long term after approval.' }, { text: 'Capture rare side effects and real-world performance.' }, { text: 'Report long-term findings back to the sponsor.' }], next: 'Long-term data informs labeling and future studies.' }\n    ];\n    const active = this.state.phase || 'p1';\n    const base = 'font-family:DM Sans,system-ui,sans-serif;font-weight:700;font-size:17px;min-height:48px;padding:0 28px;border-radius:999px;cursor:pointer;';\n    const tabs = phases.map((p) => ({\n      label: p.label,\n      pick: () => this.setState({ phase: p.id }),\n      style: base + (p.id === active ? 'background:#106EBE;color:#ffffff;border:2px solid #106EBE;' : 'background:#ffffff;color:#106EBE;border:2px solid #106EBE;')\n    }));\n    const cur = phases.find((p) => p.id === active) || phases[0];\n    return { tabs, cur };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
